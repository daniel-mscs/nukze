<!doctype html>
<html lang="pt-BR">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Site sob medida, agendamento online e painel de gestão para barbearias, estúdios de tatuagem, manicures e salões. Teste a demo e monte seu plano."
    />
    <meta name="theme-color" content="#07070c" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://nukze.com.br/" />

    <!-- Card quando o link é compartilhado (WhatsApp, Instagram, LinkedIn...) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Nukze" />
    <meta property="og:title" content="Nukze · Site, agenda e WhatsApp no automático" />

    <meta property="og:image" content="https://nukze.com.br/og.jpg" />

    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nukze: seu negócio no automático" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Dados estruturados: ajudam o Google a entender o que é o site -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Nukze",
        "description": "Sites sob medida, agendamento online e painel de gestão para negócios de serviço.",
        "url": "https://nukze.com.br/",
        "image": "https://nukze.com.br/og.jpg",
        "areaServed": "BR",
        "address": { "@type": "PostalAddress", "addressLocality": "Santa Maria", "addressRegion": "RS", "addressCountry": "BR" },
        "founder": { "@type": "Person", "name": "Daniel Alves" },
        "sameAs": ["https://www.instagram.com/nukze.empresas/", "https://www.instagram.com/daniel.mscs/", "https://www.linkedin.com/in/daniel-mscs/", "https://github.com/daniel-mscs"]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&family=Fraunces:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Unbounded:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Nukze · Site e agenda pro seu negócio</title>
